name: GHCR Cleanup

on:
  schedule:
    - cron: "30 1 * * *" # runs daily at 01:30 UTC
  workflow_dispatch:

jobs:
  cleanup:
    name: Clean up GHCR images
    runs-on: ubuntu-latest

    permissions:
      packages: write # required to delete images
      contents: read

    steps:
      - name: Delete old and untagged images
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          dry-run: true

          # ---- retention rules ----
          delete-untagged: true
          keep-n-tagged: 10
          keep-n-untagged: 5

          # Optional filters
          exclude-tags: latest,stable
          older-than: 30 days
